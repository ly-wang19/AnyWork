name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python 3.11
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Run unit and lifecycle tests
        run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: ${{ github.workspace }}/src
      - name: Validate all three CLI languages
        run: |
          python anywork-cli.py doctor --lang en
          python anywork-cli.py doctor --lang zh-CN
          python anywork-cli.py doctor --lang ja
